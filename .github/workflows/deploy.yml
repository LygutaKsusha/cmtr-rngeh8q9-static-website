name: Deploy to Elastic Beanstalk

on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-west-1
  APP_NAME: cmtr-rngeh8q9-app
  ENV_NAME: cmtr-rngeh8q9-env

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve EB bucket
        run: echo "S3_BUCKET=$(aws s3 ls | awk '{print $3}' | grep '^elasticbeanstalk-')" >> $GITHUB_ENV

      - name: Package
        run: zip -r app-${{ github.sha }}.zip application.py requirements.txt Procfile

      - name: Upload to S3
        run: aws s3 cp app-${{ github.sha }}.zip s3://${{ env.S3_BUCKET }}/app-${{ github.sha }}.zip

      - name: Create application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ env.APP_NAME }} \
            --version-label ${{ github.sha }} \
            --source-bundle S3Bucket=${{ env.S3_BUCKET }},S3Key=app-${{ github.sha }}.zip

      - name: Deploy
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name ${{ env.ENV_NAME }} \
            --version-label ${{ github.sha }}

      - name: Wait for completion
        run: aws elasticbeanstalk wait environment-updated --environment-names ${{ env.ENV_NAME }}
